name: Build Game for Windows

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # RETTET: Bruker nå den riktige, oppdaterte GitHub-aksjonen
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: nightly # Laster ned nyeste fungerende versjon automatisk

      - name: Build Game
        run: odin build . -target:windows_amd64 -subsystem:windows -out:odin-pong-windows.exe

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: odin-pong-windows.exe
